
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Student Task Manager</h1>
            <p>Aplikasi Pengelola Daftar Tugas Kuliah</p>
        </header>

        <section class="statistik">
            <div class="card">
                <h3>Total Tugas</h3>
                <p id="total">0</p>
            </div>

            <div class="card">
                <h3>Belum Selesai</h3>
                <p id="belum">0</p>
            </div>

            <div class="card">
                <h3>Selesai</h3>
                <p id="selesai">0</p>
            </div>
        </section>

        <section class="form-tugas">
            <h2>Tambah Tugas Baru</h2>

            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Masukkan nama tugas..."
                    required
                >

                <button type="submit">Tambah Tugas</button>
            </form>
        </section>

        <section class="daftar">
            <h2>Daftar Tugas Kuliah</h2>

            <ul id="taskList"></ul>
        </section>

        <footer>
            <p>Dibuat menggunakan HTML, CSS, dan JavaScript</p>
            <p>Nama: Ely Yuliana | NIM: 2452004</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
